name: Read∞ Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 Android debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK and SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.15.4

      - name: Verify and Clone Missing Submodules
        run: |
          git submodule update --init --recursive --force || true
          # Guarantee foliate-js workspace entry exists if git failed to pull it
          if [ ! -f "packages/foliate-js/package.json" ]; then
            mkdir -p packages/foliate-js
            git clone --depth 1 https://github.com/johnfactotum/foliate-js.git packages/foliate-js || true
            echo '{"name": "foliate-js", "version": "0.1.0", "private": true, "main": "view.js"}' > packages/foliate-js/package.json
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js Static Assets
        run: |
          # If a prebuild script exists, execute it to generate WASM and plugins
          pnpm run prebuild || true
          pnpm --filter readest-app build || pnpm run build

      - name: Build Tauri Android APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-linux-android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadInfinity-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
