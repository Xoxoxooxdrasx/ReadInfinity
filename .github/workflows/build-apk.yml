name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Tauri Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch All Submodules Recursively
        run: |
          # Sync and force update all registered submodules
          git submodule sync --recursive || true
          git submodule update --init --recursive --force || true

          # If tauri-plugin-turso submodule didn't clone, pull it directly
          TURSO_DIR="apps/readest-app/src-tauri/plugins/tauri-plugin-turso"
          if [ ! -f "$TURSO_DIR/Cargo.toml" ]; then
            mkdir -p "$TURSO_DIR"
            git clone --depth 1 https://github.com/daltonmenezes/tauri-plugin-turso.git "$TURSO_DIR" || true
          fi

          # Ensure foliate-js exists for pnpm workspace
          mkdir -p packages/foliate-js
          if [ ! -f "packages/foliate-js/package.json" ]; then
            git clone --depth 1 https://github.com/johnfactotum/foliate-js.git packages/foliate-js || true
            cat << 'EOF' > packages/foliate-js/package.json
          {
            "name": "foliate-js",
            "version": "0.1.0",
            "private": true,
            "main": "view.js"
          }
          EOF
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.15.4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/readest-app
          args: --target aarch64-linux-android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadInfinity-aarch64-debug
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
