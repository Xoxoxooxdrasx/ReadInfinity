name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Tauri Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.15.4

      - name: Prepare Foliate, Submodules, and Vendor Assets
        run: |
          # 1. Guarantee foliate-js exists for pnpm workspace
          rm -rf packages/foliate-js
          git clone --depth 1 https://github.com/readest/foliate-js.git packages/foliate-js

          # 2. Guarantee js-mdict exists for Next.js import
          rm -rf packages/js-mdict
          git clone --depth 1 https://github.com/readest/js-mdict.git packages/js-mdict

          # 3. Clone plugins into apps/readest-app/src-tauri/plugins
          PLUGINS_DIR="apps/readest-app/src-tauri/plugins"
          mkdir -p "$PLUGINS_DIR"
          rm -rf "$PLUGINS_DIR/tauri-plugin-turso" "$PLUGINS_DIR/tauri-plugin-webview-upgrade"
          git clone --depth 1 https://github.com/readest/tauri-plugin-turso.git "$PLUGINS_DIR/tauri-plugin-turso"
          git clone --depth 1 https://github.com/readest/tauri-plugin-webview-upgrade.git "$PLUGINS_DIR/tauri-plugin-webview-upgrade"

          # 4. Remove packages/tauri workspace reference so Cargo doesn't look for it
          if [ -f "Cargo.toml" ]; then
            sed -i '/packages\/tauri/d' Cargo.toml
          fi

          # 5. Fetch prebuilt vendor assets (pdfjs & simplecc) directly from official Readest repo
          VENDOR_DIR="apps/readest-app/public/vendor"
          mkdir -p "$VENDOR_DIR/pdfjs" "$VENDOR_DIR/simplecc"

          # Clone vendor directory from upstream readest
          git clone --depth 1 --filter=blob:none --sparse https://github.com/readest/readest.git /tmp/readest-upstream
          cd /tmp/readest-upstream
          git sparse-checkout set apps/readest-app/public/vendor
          cd -

          if [ -d "/tmp/readest-upstream/apps/readest-app/public/vendor" ]; then
            cp -r /tmp/readest-upstream/apps/readest-app/public/vendor/* "$VENDOR_DIR/"
          fi

          # Verify vendor assets exist
          echo "=== Verifying vendor files ==="
          ls -la "$VENDOR_DIR/pdfjs" || true
          ls -la "$VENDOR_DIR/simplecc" || true

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/readest-app
          args: --target aarch64-linux-android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadInfinity-aarch64-debug
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
