name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Tauri Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.15.4

      - name: Prepare Submodules and Workspace Packages
        run: |
          # 1. foliate-js & js-mdict
          rm -rf packages/foliate-js packages/js-mdict
          git clone --depth 1 https://github.com/readest/foliate-js.git packages/foliate-js
          git clone --depth 1 https://github.com/readest/js-mdict.git packages/js-mdict

          # 2. Plugins for src-tauri
          PLUGINS_DIR="apps/readest-app/src-tauri/plugins"
          mkdir -p "$PLUGINS_DIR"
          rm -rf "$PLUGINS_DIR/tauri-plugin-turso" "$PLUGINS_DIR/tauri-plugin-webview-upgrade"
          git clone --depth 1 https://github.com/readest/tauri-plugin-turso.git "$PLUGINS_DIR/tauri-plugin-turso"
          git clone --depth 1 https://github.com/readest/tauri-plugin-webview-upgrade.git "$PLUGINS_DIR/tauri-plugin-webview-upgrade"

          # 3. Clean root Cargo.toml workspace
          if [ -f "Cargo.toml" ]; then
            sed -i '/packages\/tauri/d' Cargo.toml
          fi

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Populate and Patch Vendor Assets
        run: |
          TARGET_DIR="apps/readest-app/public/vendor"
          mkdir -p "$TARGET_DIR/pdfjs" "$TARGET_DIR/simplecc"

          # 1. Fetch PDF.js & worker
          curl -sSL "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.mjs" -o "$TARGET_DIR/pdfjs/pdf.min.mjs"
          curl -sSL "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.min.mjs" -o "$TARGET_DIR/pdfjs/pdf.worker.mjs"

          # 2. Patch out dynamic Node and variable imports so Turbopack bundles cleanly
          sed -i 's|import("canvas")|Promise.resolve({})|g' "$TARGET_DIR/pdfjs/pdf.min.mjs"
          sed -i 's|import("fs")|Promise.resolve({})|g' "$TARGET_DIR/pdfjs/pdf.min.mjs"
          sed -i 's|import("http")|Promise.resolve({})|g' "$TARGET_DIR/pdfjs/pdf.min.mjs"
          sed -i 's|import("https")|Promise.resolve({})|g' "$TARGET_DIR/pdfjs/pdf.min.mjs"
          sed -i 's|import("path2d")|Promise.resolve({})|g' "$TARGET_DIR/pdfjs/pdf.min.mjs"
          # Neutralize dynamic worker import: replace import(this.workerSrc) with standard Promise return
          sed -i 's|import(this\.workerSrc)|Promise.resolve({})|g' "$TARGET_DIR/pdfjs/pdf.min.mjs"

          # 3. Fetch simplecc WASM
          if [ ! -f "$TARGET_DIR/simplecc/simplecc_wasm.js" ] && [ ! -d "$TARGET_DIR/simplecc/simplecc_wasm" ]; then
            curl -sSL "https://registry.npmjs.org/@simplecc/simplecc_wasm/-/simplecc_wasm-0.1.3.tgz" -o /tmp/simplecc.tgz || true
            if [ -f /tmp/simplecc.tgz ]; then
              tar -xzf /tmp/simplecc.tgz -C /tmp/ || true
              if [ -d /tmp/package ]; then
                cp -r /tmp/package/* "$TARGET_DIR/simplecc/"
                cp -r /tmp/package "$TARGET_DIR/simplecc/simplecc_wasm" || true
              fi
            fi
            if [ ! -f "$TARGET_DIR/simplecc/simplecc_wasm.js" ] && [ ! -d "$TARGET_DIR/simplecc/simplecc_wasm" ]; then
              mkdir -p "$TARGET_DIR/simplecc/simplecc_wasm"
              echo "export default async function init() {}; export function simplecc(text) { return text; };" > "$TARGET_DIR/simplecc/simplecc_wasm/index.js"
            fi
          fi

      - name: Build Tauri APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/readest-app
          args: --target aarch64-linux-android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadInfinity-aarch64-debug
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
