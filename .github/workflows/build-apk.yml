name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Tauri Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Submodules and Workspace Packages
        run: |
          # Globally map relative/SSH Readest dependencies to public HTTPS
          git config --global url."https://github.com/readest/".insteadOf "git@github.com:readest/"
          git config --global url."https://github.com/readest/".insteadOf "../"
          
          # Initialize all submodules using the rewrite
          git submodule sync --recursive || true
          git submodule update --init --recursive --force || true

          # Direct fallback: ensure foliate-js exists with its valid upstream code
          if [ ! -f "packages/foliate-js/package.json" ]; then
            rm -rf packages/foliate-js
            git clone --depth 1 https://github.com/readest/foliate-js.git packages/foliate-js || true
          fi

          # Direct fallback: ensure packages/tauri exists
          if [ ! -f "packages/tauri/crates/tauri/Cargo.toml" ]; then
            rm -rf packages/tauri
            git clone --depth 1 https://github.com/readest/tauri.git packages/tauri || true
          fi

          # Direct fallback: ensure tauri plugins exist
          PLUGINS_DIR="apps/readest-app/src-tauri/plugins"
          mkdir -p "$PLUGINS_DIR"
          if [ ! -f "$PLUGINS_DIR/tauri-plugin-turso/Cargo.toml" ]; then
            git clone --depth 1 https://github.com/readest/tauri-plugin-turso.git "$PLUGINS_DIR/tauri-plugin-turso" || true
          fi
          if [ ! -f "$PLUGINS_DIR/tauri-plugin-webview-upgrade/Cargo.toml" ]; then
            git clone --depth 1 https://github.com/readest/tauri-plugin-webview-upgrade.git "$PLUGINS_DIR/tauri-plugin-webview-upgrade" || true
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.15.4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-linux-android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadInfinity-aarch64-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
