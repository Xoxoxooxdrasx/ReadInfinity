name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Tauri Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.15.4

      - name: Clone Required Submodules Directly
        run: |
          # 1. Clone official readest/foliate-js
          rm -rf packages/foliate-js
          git clone --depth 1 https://github.com/readest/foliate-js.git packages/foliate-js

          # 2. Clone official readest/js-mdict
          mkdir -p packages/js-mdict
          git clone --depth 1 https://github.com/readest/js-mdict.git packages/js-mdict || true

          # 3. Clone all Tauri plugins required by src-tauri
          PLUGINS_DIR="apps/readest-app/src-tauri/plugins"
          mkdir -p "$PLUGINS_DIR"
          
          git clone --depth 1 https://github.com/readest/tauri-plugin-turso.git "$PLUGINS_DIR/tauri-plugin-turso" || true
          git clone --depth 1 https://github.com/readest/tauri-plugin-webview-upgrade.git "$PLUGINS_DIR/tauri-plugin-webview-upgrade" || true

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-linux-android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadInfinity-aarch64-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
