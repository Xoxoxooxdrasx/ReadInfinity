name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build Tauri Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Readest Submodules & Crate Manifests
        run: |
          # 1. Direct clone readest/tauri with full history to guarantee crates/tauri exists
          rm -rf packages/tauri
          git clone --depth 50 https://github.com/readest/tauri.git packages/tauri
          # If the default branch didn't have the crates folder, check out the readest branch
          if [ ! -f "packages/tauri/crates/tauri/Cargo.toml" ]; then
            cd packages/tauri
            git branch -r
            git checkout $(git branch -r | grep -E 'v2|readest|app' | head -n 1 | tr -d ' ') || true
            cd ../..
          fi

          # 2. Clone readest/foliate-js for pnpm workspace
          rm -rf packages/foliate-js
          git clone --depth 1 https://github.com/readest/foliate-js.git packages/foliate-js

          # 3. Clone readest/js-mdict
          rm -rf packages/js-mdict
          git clone --depth 1 https://github.com/readest/js-mdict.git packages/js-mdict || true

          # 4. Clone plugins for src-tauri
          PLUGINS_DIR="apps/readest-app/src-tauri/plugins"
          mkdir -p "$PLUGINS_DIR"
          rm -rf "$PLUGINS_DIR/tauri-plugin-turso" "$PLUGINS_DIR/tauri-plugin-webview-upgrade"
          git clone --depth 1 https://github.com/readest/tauri-plugin-turso.git "$PLUGINS_DIR/tauri-plugin-turso"
          git clone --depth 1 https://github.com/readest/tauri-plugin-webview-upgrade.git "$PLUGINS_DIR/tauri-plugin-webview-upgrade"

          # 5. STRICT VERIFICATION: Verify Cargo.toml manifests exist
          echo "=== Verifying Cargo workspace files ==="
          test -f packages/tauri/crates/tauri/Cargo.toml || { echo "CRITICAL: packages/tauri/crates/tauri/Cargo.toml missing!"; ls -la packages/tauri; exit 1; }
          test -f "$PLUGINS_DIR/tauri-plugin-turso/Cargo.toml" || { echo "CRITICAL: turso Cargo.toml missing!"; exit 1; }
          test -f "$PLUGINS_DIR/tauri-plugin-webview-upgrade/Cargo.toml" || { echo "CRITICAL: webview-upgrade Cargo.toml missing!"; exit 1; }
          echo "All manifests verified successfully!"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9.15.4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-linux-android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadInfinity-aarch64-debug
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
